name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Compile packages when used by tests rather than precompiling everything.
      JULIA_PKG_PRECOMPILE_AUTO: '0'

    steps:
      - uses: actions/checkout@v6

      - name: Configure example logs
        run: echo "DARONE_EXAMPLE_LOG_DIR=$RUNNER_TEMP/darone-example-logs" >> "$GITHUB_ENV"

      - name: Install Fortran and NetCDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make libnetcdf-dev libnetcdff-dev tcsh

      # The pinned Darwin3 revision bundles Cog that requires Python 3.11.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      - name: Cache Julia packages and compiled code
        uses: julia-actions/cache@v3
        with:
          delete-old-caches: false

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Check out pinned Darwin3 sources
        run: |
          set -eu
          . ./darwin-sources.env
          source_dir="$RUNNER_TEMP/darone-sources"
          mkdir -p "$source_dir"
          git init -q "$source_dir/darwin3"
          git -C "$source_dir/darwin3" remote add origin https://github.com/darwinproject/darwin3.git
          git -C "$source_dir/darwin3" fetch --quiet --depth 1 origin "$DARWIN_REV"
          git -C "$source_dir/darwin3" checkout --quiet --detach FETCH_HEAD
          git init -q "$source_dir/dar_one_config"
          git -C "$source_dir/dar_one_config" remote add origin https://github.com/barbara42/dar_one_config.git
          git -C "$source_dir/dar_one_config" fetch --quiet --depth 1 origin "$DARONE_CONFIG_REV"
          git -C "$source_dir/dar_one_config" checkout --quiet --detach FETCH_HEAD
          echo "DARONE_MITGCM_PATH=$source_dir/darwin3" >> "$GITHUB_ENV"
          echo "DARONE_CONFIG_PATH=$source_dir/dar_one_config" >> "$GITHUB_ENV"
          git config --global user.name "DarOne CI"
          git config --global user.email "darone-ci@localhost"

      - name: Test examples (all 16 global tiles, five days)
        run: |
          set -o pipefail
          julia --project=. -e 'using Pkg; Pkg.test()' 2>&1 | tee "$RUNNER_TEMP/package-tests.log"

      - name: Collect model diagnostic inventory on failure
        if: failure()
        run: |
          config_dir="$(julia --project=. -e 'using DarOne; print(configuration_root())' || true)"
          if [ -n "$config_dir" ] && [ -d "$config_dir/run" ]; then
            find "$config_dir/run" \
              -type f \( -name '3d*' -o -name 'data.diagnostics' \) \
              -printf '%p %s bytes\n' | sort > "$RUNNER_TEMP/darone-diagnostic-inventory.txt"
            head -n 100 "$RUNNER_TEMP/darone-diagnostic-inventory.txt"
          fi
          if [ -n "$config_dir" ] && [ -f "$config_dir/build/genmake.log" ]; then
            cp "$config_dir/build/genmake.log" "$RUNNER_TEMP/darone-genmake.log"
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: darone-test-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/package-tests.log
            ${{ runner.temp }}/darone-diagnostic-inventory.txt
            ${{ runner.temp }}/darone-example-logs/*.log
            ${{ runner.temp }}/darone-global-x*.log
            ${{ runner.temp }}/darone-genmake.log
